# Production deployment configuration
# Usage: 
#   1. Run migrations: docker-compose --profile migration up migrations
#   2. Start application: docker-compose --profile app up -d

services:
  # Production-specific overrides can go here
  api:
    # In production, you might want to add:
    # - Resource limits
    # - Health checks
    # - Logging configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  postgres:
    # Production-specific PostgreSQL settings
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
