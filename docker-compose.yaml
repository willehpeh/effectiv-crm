services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      frontend:
        condition: service_started
    environment:
      - NODE_ENV=production
      - DB_HOST=${PGHOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${PGUSER:-effectiv_user}
      - DB_PASSWORD=${PGPASSWORD:-effectiv_password}
      - DB_NAME=${PGDATABASE:-effectiv_crm}
      - PGSSLMODE=${PGSSLMODE:-disable}
      - PGCHANNELBINDING=${PGCHANNELBINDING:-disable}
    profiles:
      - app

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "8081:80"
    environment:
      - NODE_ENV=production
    profiles:
      - app


