services:
  postgres:
    image: postgres:16
    container_name: effectiv-crm-postgres
    environment:
      POSTGRES_DB: effectiv_crm
      POSTGRES_USER: effectiv_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-effectiv_password}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U effectiv_user -d effectiv_crm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres 
      -c max_connections=20
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://effectiv_user:${POSTGRES_PASSWORD:-effectiv_password}@postgres:5432/effectiv_crm

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "8081:80"
    environment:
      - NODE_ENV=production

volumes:
  postgres_data:
